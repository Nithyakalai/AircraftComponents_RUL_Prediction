{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>Log in</h2>
  <form method="post">
    <input name="username" placeholder="Username" required>
    <input name="password" type="password" placeholder="Password" required>
    <button type="submit">Log in</button>
  </form>
  <p>New here? <a href="{{ url_for('signup') }}">Sign up</a></p>
</div>
{% endblock %}
